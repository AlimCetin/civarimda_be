services:
  - type: web
    name: civarimda-be
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: "*"
    healthCheckPath: /health
